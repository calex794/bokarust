[workspace]

[package]
name = "front-rust-ui-compare"
version = "0.0.1"
edition = "2021"
publish = false

[features]
default = []
leptos-view = ["dep:leptos"]
dioxus-view = ["dep:dioxus", "dep:dioxus-ssr"]

[dependencies]
leptos = { version = "=0.8.22", default-features = false, features = ["ssr"], optional = true }
dioxus = { version = "=0.7.0", default-features = false, features = ["html", "macro"], optional = true }
dioxus-ssr = { version = "=0.7.0", optional = true }

[[bin]]
name = "rust-baseline"
path = "src/bin/baseline.rs"

[[bin]]
name = "leptos-ssr-compare"
path = "src/bin/leptos.rs"
required-features = ["leptos-view"]

[[bin]]
name = "dioxus-ssr-compare"
path = "src/bin/dioxus.rs"
required-features = ["dioxus-view"]

[profile.release]
lto = "thin"
codegen-units = 1
