name: Rust full test audit

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: bokarust_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bokarust_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Verify all Rust targets
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install Nextest
        uses: taiki-e/install-action@fa0dd4cd0a40696e6f9766370614a5ce482e6aa8 # v2.77.5
        with:
          tool: nextest
      - name: Full Rust suite with finite deadlines
        run: cargo nextest run --workspace --profile nightly
      - name: Full PostgreSQL accounts integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/bokarust_ci
        run: >-
          cargo nextest run --profile nightly --package bokarust-adapters
          --run-ignored only -E 'test(integration_)'
      - name: Full PostgreSQL catalog integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/bokarust_ci
        run: >-
          cargo nextest run --profile nightly --package bokarust-web
          --run-ignored only -E 'test(integration_postgres_catalog_)'
      - name: Full PostgreSQL reader integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/bokarust_ci
        run: >-
          cargo nextest run --profile nightly --package bokarust-web
          --run-ignored only -E 'test(integration_reading_)'
      - name: Full PostgreSQL author save integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/bokarust_ci
        run: >-
          cargo nextest run --profile nightly --package bokarust-web
          --run-ignored only -E 'test(integration_author_)'
      - name: Full PostgreSQL reading progress integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/bokarust_ci
        run: >-
          cargo nextest run --profile nightly --package bokarust-web
          --run-ignored only -E 'test(integration_progress_)'
      - name: Full browser authentication integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/bokarust_ci
        run: >-
          cargo nextest run --profile nightly --package bokarust-web
          --run-ignored only -E 'test(integration_auth_)'
      - name: Documentation tests
        run: timeout --signal=TERM --kill-after=5s 180s cargo test --workspace --doc
