name: Rust workspace

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-workspace-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: bokarust_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bokarust_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select affected Rust packages
        id: impact
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_BRANCH" ]; then
            python tools/select_rust_packages.py --base "origin/$BASE_BRANCH" --github-output "$GITHUB_OUTPUT"
          else
            python tools/select_rust_packages.py --full --github-output "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check build and all test targets
        run: cargo check --workspace --all-targets
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install Nextest
        uses: taiki-e/install-action@fa0dd4cd0a40696e6f9766370614a5ce482e6aa8 # v2.77.5
        with:
          tool: nextest
      - name: Run bounded affected Rust tests
        if: steps.impact.outputs.run_tests == 'true'
        env:
          TEST_PACKAGES: ${{ steps.impact.outputs.packages }}
        run: |
          args=()
          for package in $TEST_PACKAGES; do
            args+=(--package "$package")
          done
          cargo nextest run --profile ci "${args[@]}"
      - name: Verify PostgreSQL accounts on a real database
        if: contains(steps.impact.outputs.packages, 'bokarust-adapters')
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/bokarust_ci
        run: >-
          cargo nextest run --profile ci --package bokarust-adapters
          --run-ignored only -E 'test(integration_)'
      - name: Verify PostgreSQL catalog on a real database
        if: contains(steps.impact.outputs.packages, 'bokarust-web')
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/bokarust_ci
        run: >-
          cargo nextest run --profile ci --package bokarust-web
          --run-ignored only -E 'test(integration_postgres_catalog_)'
      - name: Verify PostgreSQL reader rejects hidden chapters
        if: contains(steps.impact.outputs.packages, 'bokarust-web')
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/bokarust_ci
        run: >-
          cargo nextest run --profile ci --package bokarust-web
          --run-ignored only -E 'test(integration_reading_)'
      - name: Verify author save, replay and conflicts on PostgreSQL
        if: contains(steps.impact.outputs.packages, 'bokarust-web')
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/bokarust_ci
        run: >-
          cargo nextest run --profile ci --package bokarust-web
          --run-ignored only -E 'test(integration_author_)'
      - name: Verify reading library and monotone progress on PostgreSQL
        if: contains(steps.impact.outputs.packages, 'bokarust-web')
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/bokarust_ci
        run: >-
          cargo nextest run --profile ci --package bokarust-web
          --run-ignored only -E 'test(integration_progress_)'
      - name: Verify browser authentication with PostgreSQL
        if: contains(steps.impact.outputs.packages, 'bokarust-web')
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/bokarust_ci
        run: >-
          cargo nextest run --profile ci --package bokarust-web
          --run-ignored only -E 'test(integration_auth_)'
      - name: Run documentation tests
        if: steps.impact.outputs.run_tests == 'true'
        env:
          TEST_PACKAGES: ${{ steps.impact.outputs.packages }}
        run: |
          args=()
          for package in $TEST_PACKAGES; do
            args+=(--package "$package")
          done
          timeout --signal=TERM --kill-after=5s 120s cargo test --doc "${args[@]}"
      - name: Save selection explanation
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-test-selection
          path: .repo-check/test-selection.json
          if-no-files-found: warn
