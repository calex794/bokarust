name: PostgreSQL HTTP authentication contract

on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - ".github/workflows/auth-http.yml"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - ".github/workflows/auth-http.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-http:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: bokarust_auth_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bokarust_auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/bokarust_auth_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: HTTP registration, login, profile and logout on PostgreSQL
        run: cargo test -p bokarust-web --test auth_http_postgres -- --ignored --nocapture
