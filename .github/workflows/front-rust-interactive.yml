name: FrontRust investigation (Docs and Board browser trace)

on:
  pull_request:
    paths:
      - "experiments/front-rust-ui-compare/interactive/**"
      - ".github/workflows/front-rust-interactive.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interactive-paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native history and Unicode tests, and actual WASM build
        shell: bash
        run: |
          set -euo pipefail
          BASE=experiments/front-rust-ui-compare/interactive
          export CARGO_TARGET_DIR="$RUNNER_TEMP/front-rust-interactive"
          rustc --version | tee "$RUNNER_TEMP/rust-version.txt"
          cargo test --manifest-path "$BASE/Cargo.toml" --all-targets
          cargo build --manifest-path "$BASE/Cargo.toml" --lib --target wasm32-unknown-unknown --release
          mkdir -p "$BASE/results"
          cp "$RUNNER_TEMP/rust-version.txt" "$BASE/results/rust-version.txt"
          cp "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/front_rust_interactive_probe.wasm" "$BASE/results/core.wasm"
      - name: Controlled Chromium browser interaction and parity
        shell: bash
        run: |
          set -euo pipefail
          BASE=experiments/front-rust-ui-compare/interactive
          node --check "$BASE/web/app.js"
          node --check "$BASE/scripts/chrome.mjs"
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME" || { echo "No Chromium browser on runner"; exit 1; }
          export CHROME
          "$CHROME" --version | tee "$BASE/results/chrome-version.txt"
          node "$BASE/scripts/chrome.mjs" --wasm "$BASE/results/core.wasm" --out "$BASE/results/interactive.json"
          python3 -m json.tool "$BASE/results/interactive.json" > /dev/null
      - name: Restart a native client and verify atomic disk recovery
        shell: bash
        run: |
          set -euo pipefail
          BASE=experiments/front-rust-ui-compare/interactive
          export CARGO_TARGET_DIR="$RUNNER_TEMP/front-rust-interactive"
          cargo build --manifest-path "$BASE/Cargo.toml" --bin snapshot-cli
          CLI="$CARGO_TARGET_DIR/debug/snapshot-cli"
          D="$(mktemp -d)"
          trap 'rm -rf "$D"' EXIT
          "$CLI" seed "$D/data.frst" | tee "$BASE/results/disk-initial.json"
          "$CLI" inspect "$D/data.frst" | tee "$BASE/results/restarted.json"
          "$CLI" export "$D/data.frst" "$D/download.frst"
          "$CLI" import "$D/replica.frst" "$D/download.frst" | tee "$BASE/results/replica.json"
          cmp "$D/data.frst" "$D/replica.frst"
          "$CLI" mutate "$D/data.frst" | tee "$BASE/results/updated.json"
          cp "$D/data.frst" "$D/stable-copy.frst"
          if "$CLI" interrupt "$D/data.frst"; then
            echo "ERROR: interrupted persistence unexpectedly succeeded"
            exit 1
          fi
          cmp "$D/data.frst" "$D/stable-copy.frst"
          "$CLI" inspect "$D/data.frst" | tee "$BASE/results/recovered.json"
          cp "$D/data.frst" "$D/corrupted.frst"
          printf x | dd of="$D/corrupted.frst" bs=1 seek=40 count=1 conv=notrunc status=none
          if "$CLI" import "$D/data.frst" "$D/corrupted.frst"; then
            echo "ERROR: corrupted snapshot unexpectedly replaced current file"
            exit 1
          fi
          cmp "$D/data.frst" "$D/stable-copy.frst"
          python3 - "$BASE/results" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          a=json.loads((p/'disk-initial.json').read_text())
          b=json.loads((p/'restarted.json').read_text())
          c=json.loads((p/'replica.json').read_text())
          d=json.loads((p/'updated.json').read_text())
          e=json.loads((p/'recovered.json').read_text())
          assert a==b==c, (a,b,c)
          assert d==e and d['board_revision']==a['board_revision']+1
          assert d['document_revision']==a['document_revision']+1
          print('PASS: separate native processes, replica import, interrupt and invalid snapshot are safe')
          PY
      - name: Preserve evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: front-rust-docs-board-browser
          path: experiments/front-rust-ui-compare/interactive/results/
          if-no-files-found: warn
          retention-days: 30