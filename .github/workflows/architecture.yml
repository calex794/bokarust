name: Architecture and repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests for architecture rules
        run: python -m unittest discover -s tests/architecture -p 'test_*.py' -v
      - name: Check architecture and sizes
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_BRANCH" ]; then
            python tools/architecture_check.py --base "origin/$BASE_BRANCH"
          else
            python tools/architecture_check.py --all
          fi
