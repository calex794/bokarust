name: PostgreSQL catalog contract

on:
  pull_request:
    paths:
      - "crates/**"
      - "migrations/**"
      - "Cargo.toml"
      - ".github/workflows/postgres-catalog.yml"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "migrations/**"
      - "Cargo.toml"
      - ".github/workflows/postgres-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: bokarust_test
          POSTGRES_USER: bokarust
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bokarust -d bokarust_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://bokarust:test-only-password@127.0.0.1:5432/bokarust_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Compile and exercise real PostgreSQL catalog
        run: cargo test -p bokarust-web --test postgres_public_catalog -- --nocapture
