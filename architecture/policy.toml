# Versioned architectural budgets for the new Rust repository.
[limits]
source_warn = 400
source_block = 600
test_warn = 800
test_block = 1000
fanout_warn = 8
fanout_block = 15

# Classify each newly introduced local Cargo package explicitly.
# shared: reusable value types; domain: rules; application: use cases;
# infrastructure: database/storage adapters; edge: web/API/worker entry points.
[packages]

[forbidden_external]
domain = ["axum", "sqlx", "reqwest", "hyper", "tokio-postgres", "diesel", "rusqlite", "aws-sdk-s3", "redis"]

# [[exceptions]]
# rule = "FILE_SIZE"
# path = "crates/book-domain/src/lib.rs"
# reason = "Explain a temporary, narrowly scoped exception."
# issue = "BKR-123"
# expires = 2026-11-01
