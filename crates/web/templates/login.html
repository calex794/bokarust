<section class="section auth-section">
  <div class="container">
    <div class="auth-card">
      <p class="eyebrow">Личный кабинет</p>
      <h1>Вход</h1>
      <p class="page-description">Вход в учётную запись пока не подключён. Мы добавляем безопасные сеансы и хранение пользователей.</p>
      <form class="auth-form" aria-label="Форма входа (пока недоступна)">
        <label for="login-email">Электронная почта</label>
        <input id="login-email" type="email" autocomplete="email" placeholder="mail@example.ru" disabled>
        <label for="login-password">Пароль</label>
        <input id="login-password" type="password" autocomplete="current-password" disabled>
        <button class="button" type="button" disabled>Войти</button>
      </form>
      <p class="auth-card__footer">Нет учётной записи? <a href="/register">Перейти к регистрации</a></p>
    </div>
  </div>
</section>
