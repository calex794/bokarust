<section class="section reader-page">
  <div class="container reader-width">
    <nav aria-label="Навигация по книге">
      <a class="text-link" href="/books/<!--BOOK_ID-->">← <!--BOOK_TITLE--></a>
      <span> · </span><a class="text-link" href="/me/library">Моё чтение</a>
    </nav>
    <h1><!--CHAPTER_TITLE--></h1>
    <p class="eyebrow">Опубликованная версия <!--CHAPTER_VERSION--></p>
    <p class="page-description">Место сохраняется в вашем аккаунте. Если автоматическое сохранение недоступно, используйте кнопку возле нужного отрывка.</p>
    <p id="reader-save-status" class="reader-save-status" role="status" aria-live="polite">Чтобы сохранить место, нажмите «Запомнить место здесь» возле отрывка.</p>
    <!--SAVED_PLACE-->
    <form id="save-position" action="/read/<!--CHAPTER_ID-->/place" method="post">
      <input type="hidden" name="csrf_token" value="<!--CSRF-->">
      <input type="hidden" name="version_id" value="<!--VERSION_ID-->">
    </form>
    <article class="reader-sections"><!--CHAPTER_BLOCKS--></article>
    <p><a href="/me/library">К сохранённому чтению</a></p>
  </div>
  <script src="/assets/reader-progress.js" defer></script>
</section>
