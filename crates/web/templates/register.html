<section class="section auth-section">
  <div class="container">
    <div class="auth-card">
      <p class="eyebrow">Личный кабинет</p>
      <h1>Регистрация</h1>
      <p class="page-description">Регистрация пока недоступна. Сначала подключаем проверку данных, защищённое хранение паролей и сеансы.</p>
      <form class="auth-form" aria-label="Форма регистрации (пока недоступна)">
        <label for="register-name">Никнейм</label>
        <input id="register-name" type="text" autocomplete="username" disabled>
        <label for="register-email">Электронная почта</label>
        <input id="register-email" type="email" autocomplete="email" disabled>
        <label for="register-password">Пароль</label>
        <input id="register-password" type="password" autocomplete="new-password" disabled>
        <button class="button" type="button" disabled>Создать аккаунт</button>
      </form>
      <p class="auth-card__footer">Уже есть учётная запись? <a href="/login">Перейти ко входу</a></p>
    </div>
  </div>
</section>
