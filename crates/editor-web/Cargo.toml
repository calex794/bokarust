[package]
name = "editor-web"
version = "0.1.0"
edition = "2021"
[dependencies]
leptos = { version = "0.8", features = ["csr"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlTextAreaElement","HtmlInputElement","Document","HtmlDocument","Window","Navigator","EventTarget","BeforeUnloadEvent"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-net = { version = "0.6", features = ["json"] }
gloo-timers = "0.3"
serde_json = "1"
editor-core = { path = "../editor-core" }
pulldown-cmark = "0.13"
ammonia = "4"
